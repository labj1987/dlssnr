name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same package list build-appimage.sh installs on a from-scratch image --
      # libgtk-4-dev/libadwaita-1-dev for the gui crate (glib-sys and friends need the
      # real system libraries via pkg-config, not just a Rust toolchain), plus mingw
      # for the Windows-only helper crate.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Install Rust
        run: rustup target add x86_64-pc-windows-gnu

      - name: Configure the mingw linker
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          ar = "x86_64-w64-mingw32-ar"
          EOF

      # Plain `cargo test`/`cargo check` respect the workspace's `default-members`
      # (see root Cargo.toml), which deliberately excludes `dlssnr-helper` -- a
      # Windows-only crate that must never be built for the host. See the project's
      # CLAUDE.md "Workspace layout" section for why `--workspace`/`--all` must not be
      # used here.
      - name: cargo test (native crates)
        run: cargo test

      - name: cargo check (helper, cross-compiled)
        run: cargo check --target x86_64-pc-windows-gnu -p dlssnr-helper
