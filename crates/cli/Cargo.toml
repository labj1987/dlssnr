[package]
name = "dlssnr-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Helper-manager CLI: init/start/stop/status/doctor/runner-discovery/import-binaries"

[[bin]]
name = "dlssnr-cli"
path = "src/main.rs"

[dependencies]
dlssnr-protocol = { path = "../protocol" }
anyhow = "1"
libc = "0.2"
# Process-group supervision (setsid, signaling a whole group) -- the one place
# upstream's bash script was doing something bash is naturally good at (see
# process.rs's doc comment for why this needed care to actually replicate).
nix = { version = "0.29", features = ["process", "signal"] }
